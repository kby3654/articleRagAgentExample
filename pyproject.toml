[project]
name = "law-rag-agent"
version = "0.1.0"
description = "Korean legal RAG agent with DeepSeek LLM"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",   # DeepSeek LLM (OpenAI-compatible)
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "chromadb>=0.5,<0.6",
    "streamlit>=1.40",
    "pandas>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "rag"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
